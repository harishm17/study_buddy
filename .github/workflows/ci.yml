name: StudyBuddy CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      DATABASE_URL: postgresql://dev:devpass@localhost:5432/studybuddy
      NEXTAUTH_SECRET: ci-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma validate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    env:
      DATABASE_URL: postgresql://dev:devpass@localhost:5432/studybuddy
      ANTHROPIC_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: '0.12.23'
          enable-cache: true
          cache-dependency-glob: ai-service/uv.lock
      - run: uv sync --locked --python 3.14
      - run: uv run python -m compileall -q app
      - run: uv run pytest -q

  frontend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t studybuddy-frontend frontend
      - name: Image runs as a non-root user and serves the sign-in page
        run: |
          test "$(docker run --rm --entrypoint id studybuddy-frontend -u)" != "0"
          # Railway's pre-deploy command runs `prisma migrate deploy` in this image.
          docker run --rm --network none --entrypoint prisma studybuddy-frontend --version
          docker run -d --name web -p 3000:3000 \
            -e DATABASE_URL=postgresql://u:p@127.0.0.1:1/db \
            -e NEXTAUTH_SECRET=ci-secret -e NEXTAUTH_URL=http://127.0.0.1:3000 \
            studybuddy-frontend
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:3000/login && exit 0
            sleep 1
          done
          docker logs web
          exit 1

  ai-service-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t studybuddy-ai ai-service
      - name: Image runs as a non-root user
        run: |
          uid="$(docker run --rm --entrypoint id studybuddy-ai -u)"
          echo "uid=$uid"
          test "$uid" != "0"
      - name: Embedding model and tokenizer load offline as the app user
        run: |
          docker run --rm --network none --entrypoint python studybuddy-ai -c \
            "import os; from fastembed import TextEmbedding; m = TextEmbedding(model_name='BAAI/bge-small-en-v1.5', cache_dir=os.environ['EMBEDDING_CACHE_DIR']); print(len(next(iter(m.embed(['hello'])))))"
          docker run --rm --network none --entrypoint python studybuddy-ai -c \
            "import tiktoken; print(len(tiktoken.get_encoding('cl100k_base').encode('hello world')))"
      - name: catdoc is available for legacy .doc uploads
        run: docker run --rm --network none --entrypoint catdoc studybuddy-ai -V
      - name: Image starts and answers health checks
        run: |
          docker run -d --name ai -p 8000:8000 \
            -e DATABASE_URL=postgresql://u:p@127.0.0.1:1/db -e ANTHROPIC_API_KEY=test-key \
            studybuddy-ai
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          docker logs ai
          exit 1
