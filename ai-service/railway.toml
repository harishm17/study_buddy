# Railway Configuration for StudyBuddy AI Service
# https://docs.railway.app/deploy/config-as-code

[build]
  builder = "dockerfile"
  dockerfilePath = "Dockerfile"

[deploy]
  # Start command
  startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"

  # Health check endpoint
  healthcheckPath = "/health"
  healthcheckTimeout = 100

  # Restart policy
  restartPolicyType = "on-failure"
  restartPolicyMaxRetries = 10

# Environment variables (set in Railway dashboard):
# - ANTHROPIC_API_KEY
# - OPENAI_API_KEY (optional, realtime voice coach only)
# - DATABASE_URL (from Railway PostgreSQL)
# - ENVIRONMENT=production
# - Give the service at least 2 GB of memory: the embedding model runs in-process
